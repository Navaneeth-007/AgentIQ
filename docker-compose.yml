services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data        # Persist DB and generated reports
    command: python scripts/start_api.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    command: streamlit run frontend/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - API_BASE=http://api:8000
      - AGENTIQ_API_TOKEN=${AGENTIQ_API_TOKEN:-}
    restart: unless-stopped
