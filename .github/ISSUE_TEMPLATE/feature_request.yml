name: Feature request
description: Suggest a focused improvement.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What problem should this solve?
      description: Describe a concrete use case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected workflow and any alternatives.
